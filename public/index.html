<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101426;
      color: white;
    }

    header {
      background: #191f38;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #353d5b;
    }

    header h1 {
      margin: 0;
      color: #8e9cff;
    }

    header p {
      margin-bottom: 0;
      color: #c4c9df;
    }

    #chat {
      height: calc(100vh - 220px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 90%;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      background: #252d4c;
      margin-right: auto;
    }

    .user {
      background: #5969e8;
      margin-left: auto;
    }

    .controls {
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 12px;
      background: #191f38;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #424b70;
      background: #101426;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #7785ff;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 NOVA AI</h1>
    <p>Your personal and business assistant</p>
  </header>

  <div id="chat">
    <div class="message bot">
      Hello! 👋 I'm NOVA AI.<br><br>
      I can help you learn, develop business ideas,
      and explore technology.<br><br>
      Kedu! How can I help you today?
    </div>
  </div>

  <div class="controls">
    <input
      id="userInput"
      type="text"
      placeholder="Message NOVA..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">
      Send
    </button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");

    const messages = [];

    function addMessage(text, sender) {
      const message = document.createElement("div");

      message.className = "message " + sender;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || sendButton.disabled) return;

      addMessage(message, "user");

      messages.push({
        role: "user",
        content: message
      });

      input.value = "";
      sendButton.disabled = true;

      const loadingMessage = addMessage(
        "NOVA AI is thinking...",
        "bot"
      );

      try {
        const controller = new AbortController();
const timeout = setTimeout(() => controller.abort(), 30000);

const response = await fetch("/api/chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    messages: messages
  }),
  signal: controller.signal
});

clearTimeout(timeout);

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        if (!data.reply) {
          throw new Error("NOVA AI returned an empty response.");
        }

        loadingMessage.textContent = data.reply;

        messages.push({
          role: "assistant",
          content: data.reply
        });

      } catch (error) {
        loadingMessage.textContent =
          "Sorry, I couldn't connect right now. " + error.message;

        messages.pop();
      }

      sendButton.disabled = false;
      chat.scrollTop = chat.scrollHeight;
      input.focus();
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
